name: CLA check

# The caller for this repository itself. Every other geastack repository
# carries the same file as .github/workflows/cla.yml; here that name is taken
# by the reusable workflow it calls.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    uses: geastack/.github/.github/workflows/cla.yml@main
    secrets: inherit
